# Shared settings for every arm. Arms live in configs/arms/<name>.yaml.
data_dir: data/bird_dev
db: thrombosis_prediction
cache_dir: cache/llm
arms_dir: configs/arms
orders: [0, 1, 2]
max_steps: 8

# SQL agent profiles. Pick one per run with --agent (default below). Each profile keeps its own runs,
# noise rate and results, so answers from different agent models never mix. Ollama is the manual fallback.
agent_profile: deepseek
agents:
  # DeepSeek API. Thinking off: cheapest and deterministic at temperature 0 (turn on if accuracy is poor).
  # Prompts are static-first (rules, schema, notes, then question) so DeepSeek's prefix cache hits across calls.
  deepseek:
    model: deepseek-flash
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    options: {extra_body: {thinking: {type: disabled}}}
    usd_per_million: {cache_hit: 0.003, cache_miss: 0.15, output: 0.60}  # off-peak list prices; peak is 2x
    runs_dir: runs_deepseek
    results_dir: results_deepseek
  # Local Ollama alias with a 32k context (see ollama/qwen3.5-9b-32k.Modelfile). Free, no limits, slow.
  local:
    model: qwen3.5-9b-32k
    base_url: http://localhost:11434/v1
    api_key_env: null
    options: {reasoning_effort: none}  # thinking off: ~10x faster
    runs_dir: runs
    results_dir: results

# Proposer: one call per wrong answer, no tools. Thinking on for a better diagnosis of the mistake.
proposer:
  model: deepseek-flash
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  options: {extra_body: {thinking: {type: enabled}}}
  usd_per_million: {cache_hit: 0.003, cache_miss: 0.15, output: 0.60}
