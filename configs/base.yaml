# EvoSQL settings: a streaming per-database memory (facts vs examples) on EHRSQL (spec docs/specs/2026-09-30-evosql-v8-design.md).
data_dir: data/ehrsql
cache_dir: cache/llm
max_steps: 8

# SQL agent profiles; pick one with --agent. Each keeps its own runs and results so models never mix.
# Every prompt has the schema and a per-column value profile ending in the column's corrected description.
agent_profile: deepseek
agents:
  # DeepSeek, thinking off (deterministic, cheap).
  deepseek:
    model: deepseek-flash
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    options: {extra_body: {thinking: {type: disabled}}}
    usd_per_million: {cache_hit: 0.006, cache_miss: 0.30, output: 1.20}  # peak list prices: an upper bound (off-peak is half)
    runs_dir: runs_v8
    results_dir: results_v8
  # Optional free fallback: local Ollama alias with a 32k context (see ollama/qwen3.5-9b-32k.Modelfile).
  local:
    model: qwen3.5-9b-32k
    base_url: http://localhost:11434/v1
    api_key_env: null
    options: {reasoning_effort: none}
    runs_dir: runs_local
    results_dir: results_local

# Proposer: one call per failure of the facts arm and per consolidation pass; thinking on, JSON output.
proposer:
  model: deepseek-v4-pro
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  options: {extra_body: {thinking: {type: enabled}}, reasoning_effort: medium, response_format: {type: json_object}}
  usd_per_million: {cache_hit: 0.044, cache_miss: 1.32, output: 3.96}  # peak list prices: an upper bound

# JEV (TypeSafe's decision model on OpenRouter) scores how directly each fact applies to a question.
jev:
  model: typesafe/jev-1.13
  url: https://openrouter.ai/api/alpha/decisions
  api_key_env: OPENROUTER_API_KEY

# Local Ollama embeddings: the pre-check shortlist and the examples arm's similar earlier questions.
embed:
  model: qwen3-embedding:0.6b
  url: http://localhost:11434/v1

stream:
  questions: data/ehrsql/stream_v8.json
  databases:  # id: one-line description for JEV's state
    mimic_iv: "MIMIC-IV hospital records demo (100 patients): admissions, diagnoses, procedures, prescriptions, labs, microbiology, ICU stays and charted vitals"
  seeds: [0]
  budget_usd: 3.0
  order_budget_usd: [3.0]       # cumulative spend allowed by the end of each order
  precheck_reserve_usd: 0.10    # pre-checks are skipped once an order is this close to its allocation
  inert_below: 0.10             # report: a stream injecting facts on fewer second-half questions is "inert"
  examples: 2                   # similar earlier questions shown per question in the examples arm
  consolidate_every: 15         # questions between consolidation passes (plus one at the end of each stream)
  rules:
    cutoff: 2.75                # JEV 0-3 score a fact needs to be injected (fixed by the offline check)
    max_facts: 2                # facts per question; an unproven fact is only ever injected alone
    idle_uses: 5                # retire a fact still at score 0 after this many uses
    precheck_pool: 8            # earlier questions most similar to a new fact, scored by JEV...
    precheck_max: 2             # ...of which at most this many are re-answered before it goes live
