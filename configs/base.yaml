# EvoSQL settings: data, agent profiles, proposer and the learn/freeze/test protocol.
data_dir: data/bird_dev
db: thrombosis_prediction
cache_dir: cache/llm
max_steps: 8

# SQL agent profiles; pick one with --agent. Each keeps its own runs and results so models never mix.
agent_profile: deepseek
agents:
  # DeepSeek, thinking off (deterministic, cheap), with the per-column value profile in the prompt.
  deepseek:
    model: deepseek-flash
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    options: {extra_body: {thinking: {type: disabled}}}
    value_profile: true
    usd_per_million: {cache_hit: 0.003, cache_miss: 0.15, output: 0.60}  # off-peak list prices; peak is 2x
    runs_dir: runs_v3
    results_dir: results_v3
  # Optional free fallback: local Ollama alias with a 32k context (see ollama/qwen3.5-9b-32k.Modelfile).
  local:
    model: qwen3.5-9b-32k
    base_url: http://localhost:11434/v1
    api_key_env: null
    options: {reasoning_effort: none}
    value_profile: true
    runs_dir: runs_local
    results_dir: results_local

# Proposer and consolidator: few calls, thinking on for a better diagnosis.
proposer:
  model: deepseek-flash
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  options: {extra_body: {thinking: {type: enabled}}, reasoning_effort: high}
  usd_per_million: {cache_hit: 0.003, cache_miss: 0.15, output: 0.60}

# Learn typed facts on n_learn questions, freeze them, test every arm on n_test other questions.
protocol:
  n_learn: 50
  n_test: 50
  seed: 0
  epochs: 2
  batch_size: 5
  min_gain: 2
  budget_usd: 1.0
  selfcons_max_n: 5
