# EvoSQL v6 settings: streaming per-database fact memory on Arcwise-Plat (spec docs/specs/2026-09-29-evosql-v6-design.md).
data_dir: data/bird_dev
cache_dir: cache/llm
max_steps: 8

# SQL agent profiles; pick one with --agent. Each keeps its own runs and results so models never mix.
agent_profile: deepseek
agents:
  # DeepSeek, thinking off (deterministic, cheap), with the per-column value profile in the prompt.
  deepseek:
    model: deepseek-flash
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    options: {extra_body: {thinking: {type: disabled}}}
    value_profile: true
    column_docs: true  # BIRD column descriptions (incl. normal ranges) appended to each value-profile line; v4 had false
    usd_per_million: {cache_hit: 0.006, cache_miss: 0.30, output: 1.20}  # peak list prices: an upper bound (off-peak is half)
    runs_dir: runs_v6
    results_dir: results_v6
  # Optional free fallback: local Ollama alias with a 32k context (see ollama/qwen3.5-9b-32k.Modelfile).
  local:
    model: qwen3.5-9b-32k
    base_url: http://localhost:11434/v1
    api_key_env: null
    options: {reasoning_effort: none}
    value_profile: true
    runs_dir: runs_local
    results_dir: results_local

# Proposer: few calls, thinking on for a better diagnosis.
proposer:
  model: deepseek-flash
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  options: {extra_body: {thinking: {type: enabled}}, reasoning_effort: medium}
  usd_per_million: {cache_hit: 0.006, cache_miss: 0.30, output: 1.20}

# Hybrid fact search (retrieve and tool modes): BM25 + local Ollama embeddings, fused with RRF.
search:
  embed_model: qwen3-embedding:0.6b
  embed_url: http://localhost:11434/v1
  # Measured on v3 facts and discovery questions: 98% of fact/source-question pairs score >= 0.5, unrelated median 0.42.
  min_cosine: 0.5
  retrieve_cap: 8
  tool_k: 5

protocol:
  budget_usd: 2.0

v6:
  questions: data/arcwise/arcwise_plat_full_with_diff.json
  docs_root: data/arcwise/schemas  # corrected column descriptions: <root>/<db>/database_description/<table>.csv
  databases: [formula_1, superhero, card_games, european_football_2]
  seeds: [0, 1]
  order_budget_usd: [1.0, 2.0]  # cumulative spend allowed by the end of each order
  precheck_reserve_usd: 0.10    # pre-checks are skipped once an order is this close to its allocation
  rules:
    generic_min_questions: 8
    generic_share: 0.25
    semantic_min: 0.75
    semantic_margin: 0.05
    idle_uses: 5
    precheck_max: 2
