[project]
name = "evosql"
version = "0.9.0"
description = "A Text-to-SQL agent that learns from its mistakes on one database: facts, past examples and a working-notes file, measured online"
authors = [
    { name = "harshith242", email = "v.harshith2000@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "markdown>=3.11",
    "numpy>=2.5.3",
    "openai>=3.19.2",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "tqdm>=4.70.1",
]

[project.scripts]
evosql = "evosql.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
